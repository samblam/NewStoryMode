        const PlayIcon = () => (
          <svg width="18" height="18" viewBox="0 0 18 18">
            <polygon points="4,2 16,9 4,16" />
          </svg>
        );

        const StopIcon = () => (
          <svg width="18" height="18" viewBox="0 0 18 18">
            <rect x="4" y="4" width="10" height="10" />
          </svg>
        );

        const useAudioPlaylist = (sounds) => {
          const [playing, setPlaying] = React.useState(null);
          const audioRefs = React.useRef({});
          const playlistModeRef = React.useRef(false);

          const stop = (name) => {
            if (name && audioRefs.current[name]) {
              audioRefs.current[name].pause();
              audioRefs.current[name].currentTime = 0;
            }
          };

          const handlePlay = (name) => {
            playlistModeRef.current = false;
            stop(playing);
            if (playing === name || !audioRefs.current[name]) {
              setPlaying(null);
            } else {
              audioRefs.current[name].play();
              setPlaying(name);
            }
          };

          const handleEnded = (name) => {
            if (playlistModeRef.current) {
              const currentIdx = sounds.findIndex(s => s.name === name);
              const next = sounds.slice(currentIdx + 1).find(s => s.audio);
              if (next) {
                setPlaying(next.name);
                audioRefs.current[next.name].play();
              } else {
                playlistModeRef.current = false;
                setPlaying(null);
              }
            } else {
              setPlaying(null);
            }
          };

          const handlePlaySet = () => {
            if (playlistModeRef.current) {
              stop(playing);
              playlistModeRef.current = false;
              setPlaying(null);
              return;
            }
            stop(playing);
            const first = sounds.find(s => s.audio);
            if (!first) return;
            playlistModeRef.current = true;
            setPlaying(first.name);
            audioRefs.current[first.name].play();
          };

          return { playing, audioRefs, handlePlay, handleEnded, handlePlaySet };
        };

        const SpeakerIcon = ({ side }) => (

              <line x1="50" y1="110" x2="19" y2="134" stroke="#E85A35" strokeWidth="8" strokeLinecap="square"/>

        const ScrollIndicator = ({ sections, activeSection, onDotClick }) => (

        const HomeSection = React.forwardRef((props, ref) => (

            <div className="hero-card">

              <ul className="hero-nav">

                <li>About</li>
                <li>Fun</li>

              </ul>

        const CaseStudySection = React.forwardRef(({ data }, ref) => {
          const { playing, audioRefs, handlePlay, handleEnded, handlePlaySet } = useAudioPlaylist(data.sounds);

          return (
            <section ref={ref} className="section case-study-section">
              <div className="case-study-left">
                <h1 className="case-study-title">
                  {data.title} <span>• {data.subtitle}</span>
                </h1>

                <div className="info-section">
                  <h3>Client:</h3>
                  <p>{data.client}</p>
                </div>

                <div className="info-section">
                  <h3>Problem</h3>
                  <p>{data.problem}</p>

                <div className="info-section">

                <button className="cta-link" style={{ color: data.ctaColor }} onClick={handlePlaySet}>

                </button>
              </div>

              <div className="case-study-right">
                <div className="sound-table-wrapper">
                  <div className="sound-table-container" style={{ background: data.accentColor }}>
                    <table className="sound-table">
                      <thead>
                        <tr>
                          <th></th>
                          <th>Sound</th>
                          <th>Type</th>
                          <th>Function</th>

                      </thead>
                      <tbody>
                        {data.sounds.map((sound, i) => (
                          <tr key={i}>
                            <td>
                              <button
                                className="play-btn"

                    <div className="table-footer" style={{ background: data.accentColor }}>

        const AboutSection = React.forwardRef((props, ref) => {
          const team = [
            { name: 'Ben', roles: ['Co-Founder', 'Composer'], photo: 'ben.jpg' },
            { name: 'Nick', roles: ['Co-Founder', 'Sound Designer'], photo: 'nick.png' },

              </div>
              
              <div className="about-right">
                <h4>About Us</h4>
                <h3>STORY MODE LLC</h3>
                <p>
                  Nick and Ben started Story Mode at the beginning of 2023, Sam joined the following year.
                </p>
                <p>
                  Story Mode is a music house that specializes in audio design for interfaces and human experiences.

        // Characters are positioned in three vertical tiers that span the full viewport.
        // x values are left-edge positions; y values are top-edge positions (both in vw/vh %).
        // Items within each tier are staggered in y so the layout feels irregular rather than grid-like.
        // Sizes are in vw — characters are roughly 20–30% of viewport height at 16:9, so tiers are
        // spaced ~35% apart to keep items from overlapping across rows.
        const characters = [
          // Top tier — y: 13–22%
          { name: 'bird',       video: 'character animations/bird.mp4',       audio: 'sounds/bird.wav',        x: '6%',  y: '15%', size: '13vw' },
          { name: 'glyph',      video: 'character animations/glyph.mp4',      audio: 'sounds/glyph.wav',       x: '33%', y: '22%', size: '11vw' },
          { name: 'star',       video: 'character animations/star.mp4',       audio: 'sounds/star.wav',        x: '84%', y: '13%', size: '13vw' },
          // Middle tier — y: 46–60%
          { name: 'runner',     video: 'character animations/runner.mp4',     audio: 'sounds/running man.wav', x: '40%', y: '46%', size: '14vw' },
          { name: 'mondrian',   video: 'character animations/mondrian.mp4',   audio: 'sounds/mondrian.wav',    x: '16%', y: '50%', size: '15vw' },
          { name: 'pentaline',  video: 'character animations/pentaline.mp4',  audio: 'sounds/pentaline.wav',   x: '84%', y: '50%', size: '13vw' },
          { name: 'semicircle', video: 'character animations/semicircle.mp4', audio: 'sounds/semicircle.wav',  x: '60%', y: '60%', size: '11vw' },
          // Bottom tier — y: 82–90%
          { name: 'smile',      video: 'character animations/smile.mp4',      audio: 'sounds/smile.wav',       x: '28%', y: '84%', size: '12vw' },
          { name: 'spinner',    video: 'character animations/spinner.mp4',    audio: 'sounds/spinner.wav',     x: '74%', y: '82%', size: '14vw' },
          { name: 'pizza',      video: 'character animations/pizza.mp4',      audio: 'sounds/pizza.wav',       x: '5%',  y: '88%', size: '12vw' },
          { name: 'dotsquare',  video: 'character animations/dotsquare.mp4',  audio: 'sounds/dotsquare.wav',   x: '50%', y: '90%', size: '11vw' },
        ];

        const PlaySection = React.forwardRef((props, ref) => {
          const [active, setActive] = useState(null);
          const videoRefs = useRef({});
          const audioRefs = useRef({});

          const handleEnded = (name) => {
            setActive(n => n === name ? null : n);
          };

          const handleClick = (name) => {
            // Stop whatever is currently playing
            if (active) {
              const prevVideo = videoRefs.current[active];
              const prevAudio = audioRefs.current[active];
              if (prevVideo) { prevVideo.pause(); prevVideo.currentTime = 0; }
              if (prevAudio) { prevAudio.pause(); prevAudio.currentTime = 0; }
            }

            if (active === name) {
              setActive(null);
            } else {
              const video = videoRefs.current[name];
              const audio = audioRefs.current[name];
              if (video) video.play();
              if (audio) audio.play();
              setActive(name);
            }
          };

          return (
            <section ref={ref} className="section play-section">
              {characters.map(({ name, video, audio, x, y, size }) => (
                <div key={name} className="play-item" style={{ left: x, top: y, '--item-size': size }} onClick={() => handleClick(name)}>
                  <video
                    ref={el => videoRefs.current[name] = el}
                    src={video}
                    muted
                    playsInline
                    onEnded={handleEnded.bind(null, name)}
                  />
                  <audio
                    ref={el => audioRefs.current[name] = el}
                    src={audio}
                    onEnded={handleEnded.bind(null, name)}
                  />
                </div>
              ))}
            </section>
          );
        });

        // TO ACTIVATE: Sign up free at formspree.io, create a form pointing to
        // samuel.ellis.barefoot@gmail.com, then replace YOUR_FORM_ID below with your form ID.
        const FORMSPREE_ID = 'xykbvzja';

        const ContactSection = React.forwardRef((props, ref) => {
          const [message, setMessage] = useState('');
          const [email, setEmail] = useState('');
          const [status, setStatus] = useState('idle'); // idle | sending | sent | error

          const handleSubmit = async () => {
            if (!message.trim()) return;
            setStatus('sending');
            try {
              const res = await fetch('https://formspree.io/f/' + FORMSPREE_ID, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email: email || 'not provided', message }),
              });
              if (res.ok) {
                setMessage('');
                setEmail('');
                setStatus('sent');
                setTimeout(() => setStatus('idle'), 4000);
              } else {
                setStatus('error');
                setTimeout(() => setStatus('idle'), 4000);
              }
            } catch (_) {
              setStatus('error');
              setTimeout(() => setStatus('idle'), 4000);
            }
          };

          const buttonLabel = { idle: 'Send', sending: 'Sending...', sent: 'Sent!', error: 'Try Again' }[status];

          return (
            <section ref={ref} className="section contact-section">
              <div className="contact-wrapper">

                    className="contact-email-input"
                    type="email"
                    placeholder="Your email..."
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}

                  <textarea
                    className="contact-textarea"
                    placeholder="Start Typing..."
                    value={message}
                    onChange={(e) => setMessage(e.target.value)}
                  />
                  <button
                    className="contact-submit"
                    onClick={handleSubmit}
                    disabled={status === 'sending' || status === 'sent'}
                  >
                    {buttonLabel}
                  </button>
                </div>
                <div className="contact-info">
                  <h2>How can we help?</h2>
                  
                </div>
              </div>
            </section>
          );
        });

        const caseStudies = {
          obby: {
            title: 'OBBY',
            subtitle: 'Geosocial Networking',
            client: 'A meetup app that brings people together through shared sports and activities.',
            problem: "Create a suite of sounds for their platform that would make the experience feel familiar to a networking app yet standout in it's sophistication.",

        function StoryModeWebsite() {
          const [activeSection, setActiveSection] = useState(0);
          
          const sectionRefs = [
            useRef(null), // Home
            useRef(null), // OBBY
            useRef(null), // EVA
            useRef(null), // Elysium
            useRef(null), // About
            useRef(null), // Play
            useRef(null), // Contact
          ];
          
          const sections = ['home', 'obby', 'eva', 'elysium', 'about', 'play', 'contact'];

          const scrollToSection = (index) => {
            sectionRefs[index].current?.scrollIntoView({ behavior: 'smooth' });
          };

          useEffect(() => {
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    const index = sectionRefs.findIndex(
                      (ref) => ref.current === entry.target
                    );
                    if (index !== -1) setActiveSection(index);
                  }
                });
              },
              { threshold: 0.5 }
            );

            sectionRefs.forEach((ref) => {
              if (ref.current) observer.observe(ref.current);
            });

            return () => observer.disconnect();
          }, []);

          return (
            <React.Fragment>
              <style>{styles}</style>
              
              <ColorIndicator />
              <ScrollIndicator 
                sections={sections} 
                activeSection={activeSection} 
                onDotClick={scrollToSection} 
              />
              
              <HomeSection ref={sectionRefs[0]} />
              <CaseStudySection ref={sectionRefs[1]} data={caseStudies.obby} />
              <CaseStudySection ref={sectionRefs[2]} data={caseStudies.eva} />
              <CaseStudySection ref={sectionRefs[3]} data={caseStudies.elysium} />
              <AboutSection ref={sectionRefs[4]} />
              <PlaySection ref={sectionRefs[5]} />
              <ContactSection ref={sectionRefs[6]} />
            </React.Fragment>
          );
        }

        // ============================================
        // RENDER LOGIC (Replaces export default)
        // ============================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StoryModeWebsite />);

    </script>
